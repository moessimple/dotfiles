name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # macOS, because the scripts target its /bin/bash 3.2 and BSD userland. Formatting runs as its own
    # workflow (lint.yml), so a formatting nit and a failing test are separate red checks.
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats, php, patchutils, and rush
        run: brew install bats-core php patchutils rush-parallel

      - name: Tests
        run: bin/test.sh
